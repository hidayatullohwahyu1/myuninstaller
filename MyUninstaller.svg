<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="org" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- ubin latar -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#hl)"/>
  <!-- bayangan huruf -->
  <g fill="none" stroke="#0F172A" stroke-opacity="0.25" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 5)">
    <path d="M50 180 V72 L81 146 L112 72 V180"/>
    <path d="M146 72 V150 A30 30 0 0 0 206 150 V72"/>
  </g>
  <!-- huruf M (putih) -->
  <path d="M50 180 V72 L81 146 L112 72 V180" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- huruf U (jingga) -->
  <path d="M146 72 V150 A30 30 0 0 0 206 150 V72" fill="none" stroke="url(#org)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- panah keluar dari cekungan U -->
  <g id="arrow" fill="#FFFFFF">
    <rect x="171" y="96" width="10" height="58" rx="5"/>
    <path d="M176 68 L163 96 L189 96 Z" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- kilau bersih -->
  <path id="spark" d="M220 26 Q222 34 230 36 Q222 38 220 46 Q218 38 210 36 Q218 34 220 26 Z" fill="#FFFFFF"/>
</svg>
